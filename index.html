  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Be Vietnam Pro', sans-serif; }

.app-wrapper {
  width: 100%; height: 100%; overflow-y: auto;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
  color: #e2e8f0;
}

.card-glass {
  background: rgba(30, 41, 59, 0.8);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(99, 102, 241, 0.2);
  border-radius: 16px;
}

.btn-primary {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white; border: none; border-radius: 12px;
  padding: 12px 24px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; font-family: inherit;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(99,102,241,0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.btn-secondary {
  background: rgba(99, 102, 241, 0.15);
  color: #a5b4fc; border: 1px solid rgba(99,102,241,0.3);
  border-radius: 12px; padding: 10px 20px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.btn-secondary:hover { background: rgba(99,102,241,0.25); }
.btn-secondary.playing {
  background: rgba(34, 197, 94, 0.2);
  border-color: #22c55e;
  color: #4ade80;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.7; }
}

.option-btn {
  background: rgba(30, 41, 59, 0.6);
  border: 2px solid rgba(99,102,241,0.2);
  border-radius: 12px; padding: 14px 20px;
  color: #e2e8f0; cursor: pointer; transition: all 0.2s;
  text-align: left; font-family: inherit; font-size: 15px; width: 100%;
}
.option-btn:hover { border-color: #6366f1; background: rgba(99,102,241,0.1); }
.option-btn.correct { border-color: #22c55e; background: rgba(34,197,94,0.15); color: #4ade80; }
.option-btn.wrong { border-color: #ef4444; background: rgba(239,68,68,0.15); color: #f87171; }
.option-btn:disabled { cursor: default; }

.text-input {
  background: rgba(15, 23, 42, 0.8);
  border: 2px solid rgba(99,102,241,0.3);
  border-radius: 12px; padding: 14px 18px;
  color: #e2e8f0; font-size: 16px; width: 100%;
  font-family: inherit; outline: none; transition: border-color 0.2s;
}
.text-input:focus { border-color: #6366f1; }
.text-input.correct { border-color: #22c55e; }
.text-input.wrong { border-color: #ef4444; }

.progress-bar { background: rgba(99,102,241,0.15); border-radius: 99px; height: 8px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #6366f1, #8b5cf6); transition: width 0.4s; }

.streak-badge {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: white; border-radius: 99px; padding: 4px 12px;
  font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
}

.explanation-box {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid rgba(99,102,241,0.15);
  border-radius: 12px; padding: 20px;
  margin-top: 16px; font-size: 14px; line-height: 1.8;
}
.explanation-box .label { color: #818cf8; font-weight: 600; }
.explanation-box .ipa { color: #a78bfa; font-family: 'JetBrains Mono', monospace; }

.menu-btn {
  position: fixed; top: 16px; left: 16px; z-index: 50;
  background: rgba(30,41,59,0.9); border: 1px solid rgba(99,102,241,0.3);
  border-radius: 12px; padding: 8px 14px; color: #a5b4fc;
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px; transition: all 0.2s;
}
.menu-btn:hover { background: rgba(99,102,241,0.2); }

.fade-in { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.shake { animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

.pulse { animation: pulse 0.5s ease; }
@keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.05)} 100%{transform:scale(1)} }

.firework {
  position: fixed; pointer-events: none; z-index: 999;
  animation: burst 0.8s ease-out forwards;
}
@keyframes burst {
  0% { opacity: 1; transform: translate(0, 0) scale(1); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
}

.sparkle {
  position: fixed; pointer-events: none; z-index: 998;
  animation: sparkle 1s ease-out forwards;
}
@keyframes sparkle {
  0% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0); }
}

.confetti {
  position: fixed; pointer-events: none; z-index: 999;
  animation: fall 2s ease-in forwards;
}
@keyframes fall {
  to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

.glow-pulse {
  animation: glowPulse 0.6s ease;
}
@keyframes glowPulse {
  0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
  70% { box-shadow: 0 0 0 20px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
}

.correct-answer-animation {
  animation: correctFloat 0.8s ease forwards;
}
@keyframes correctFloat {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
}

.card-hover:hover {
  transform: translateY(-6px) !important;
  box-shadow: 0 20px 50px rgba(99,102,241,0.3) !important;
}

.part-card {
  background: rgba(30,41,59,0.6);
  border: 2px solid rgba(99,102,241,0.15);
  border-radius: 16px; padding: 24px; cursor: pointer;
  transition: all 0.3s; position: relative; overflow: hidden;
}
.part-card:hover { border-color: #6366f1; transform: translateY(-4px); box-shadow: 0 12px 40px rgba(99,102,241,0.2); }
.part-card .part-num {
  position: absolute; top: -10px; right: -10px;
  font-size: 80px; font-weight: 800; color: rgba(99,102,241,0.08);
}

.timer-bar { height: 4px; background: rgba(99,102,241,0.15); border-radius: 99px; overflow: hidden; }
.timer-fill { height: 100%; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); transition: width 0.1s linear; }

.toast {
  position: fixed; top: 20px; right: 20px; z-index: 100;
  padding: 12px 20px; border-radius: 12px; font-weight: 600;
  animation: slideIn 0.3s ease, fadeOut 0.3s ease 1.5s forwards;
}
@keyframes slideIn { from { transform: translateX(100px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; transform: translateY(-20px); } }

.result-word {
  display: inline-block; padding: 4px 10px; border-radius: 8px;
  margin: 3px; font-size: 13px; font-weight: 500;
}
.result-word.correct-word { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
.result-word.wrong-word { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
</style>

// ============ AUDIO (Web Audio API) ============
let audioCtx;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.frequency.value = 523; osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
    } else if (type === 'wrong') {
      osc.frequency.value = 200; osc.type = 'square';
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
    } else if (type === 'complete') {
      osc.frequency.value = 440; osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      const osc2 = ctx.createOscillator();
      osc2.connect(gain); osc2.frequency.value = 660; osc2.type = 'sine';
      osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
      osc2.start(ctx.currentTime + 0.2); osc2.stop(ctx.currentTime + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
    }
  } catch(e) {}
}

function createFireworks(x, y) {
  const colors = ['#4ade80', '#22c55e', '#16a34a', '#86efac', '#bbf7d0'];
  const particleCount = 30;
  
  for (let i = 0; i < particleCount; i++) {
    const angle = (Math.PI * 2 * i) / particleCount;
    const velocity = 4 + Math.random() * 4;
    const tx = Math.cos(angle) * velocity * 100;
    const ty = Math.sin(angle) * velocity * 100;
    
    const particle = document.createElement('div');
    particle.className = 'firework';
    particle.style.left = x + 'px';
    particle.style.top = y + 'px';
    particle.style.width = '8px';
    particle.style.height = '8px';
    particle.style.borderRadius = '50%';
    particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    particle.style.setProperty('--tx', tx + 'px');
    particle.style.setProperty('--ty', ty + 'px');
    particle.style.boxShadow = '0 0 10px ' + particle.style.backgroundColor;
    document.body.appendChild(particle);
    
    setTimeout(() => particle.remove(), 800);
  }

  // Sparkles
  for (let i = 0; i < 15; i++) {
    setTimeout(() => {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = (x + (Math.random() - 0.5) * 200) + 'px';
      sparkle.style.top = (y + (Math.random() - 0.5) * 200) + 'px';
      sparkle.style.width = '4px';
      sparkle.style.height = '4px';
      sparkle.style.borderRadius = '50%';
      sparkle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      sparkle.style.boxShadow = '0 0 6px ' + sparkle.style.backgroundColor;
      document.body.appendChild(sparkle);
      
      setTimeout(() => sparkle.remove(), 1000);
    }, i * 30);
  }
}

  primary_color: "#6366f1",
  accent_color: "#22c55e",
  font_family: "Be Vietnam Pro",
  font_size: 16
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(msg, type) {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = type === 'correct' ? 'rgba(34,197,94,0.9)' : type === 'wrong' ? 'rgba(239,68,68,0.9)' : 'rgba(99,102,241,0.9)';
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ============ GENERATE QUESTIONS ============
function genPart1() {
  // Multiple choice: Vietnamese meaning → choose English
  return shuffle(WORDS).map(w => {
    const wrong = shuffle(WORDS.filter(x => x.en !== w.en)).slice(0, 3);
    const options = shuffle([w, ...wrong]);
    return { word: w, type: 'mc', prompt: `(${w.pos}) ${w.vi}`, options: options.map(o => o.en), answer: w.en };
  });
}

function genPart2() {
  // Fill in the blank: Vietnamese → type English
  return shuffle(WORDS).map(w => ({
    word: w, type: 'fill', prompt: `(${w.pos}) ${w.vi}`, answer: w.en
  }));
}

function genPart3() {
  // Mixed: random mc or fill
  return shuffle(WORDS).map(w => {
    const isMc = Math.random() > 0.5;
    if (isMc) {
      const wrong = shuffle(WORDS.filter(x => x.en !== w.en)).slice(0, 3);
      const options = shuffle([w, ...wrong]);
      return { word: w, type: 'mc', prompt: `(${w.pos}) ${w.vi}`, options: options.map(o => o.en), answer: w.en };
    } else {
      return { word: w, type: 'fill', prompt: `(${w.pos}) ${w.vi}`, answer: w.en };
    }
  });
}

function genPart4() {
  // English meaning → choose English word
  return shuffle(WORDS).map(w => {
    const wrong = shuffle(WORDS.filter(x => x.en !== w.en)).slice(0, 3);
    const options = shuffle([w, ...wrong]);
    return { word: w, type: 'mc', prompt: w.meaningEn, options: options.map(o => o.en), answer: w.en };
  });
}

window.startPart = function(num) {
  currentPart = num;
  currentQ = 0;
  score = 0;
  streak = 0;
  maxStreak = 0;
  wrongWords = [];
  answered = false;

  if (num === 1) partQuestions = genPart1();
  else if (num === 2) partQuestions = genPart2();
  else if (num === 3) partQuestions = genPart3();
  else partQuestions = genPart4();

  // Validation
  if (partQuestions.length !== N) {
    showToast(`Lỗi: ${partQuestions.length} câu ≠ ${N} từ`, 'wrong');
    return;
  }

  document.getElementById('menuBtn').style.display = 'flex';
  showQuestion();
}

function clearTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function startTimer(seconds) {
  clearTimer();
  timeLeft = seconds;
  const bar = document.getElementById('timerFill');
  if (!bar) return;
  bar.style.width = '100%';
  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    if (bar) bar.style.width = Math.max(0, (timeLeft / seconds) * 100) + '%';
    if (timeLeft <= 0) {
      clearTimer();
      if (!answered) handleTimeout();
    }
  }, 100);
}

function handleTimeout() {
  answered = true;
  streak = 0;
  const q = partQuestions[currentQ];
  if (!wrongWords.includes(q.word.en)) wrongWords.push(q.word.en);
  playSound('wrong');

  // Mark correct answer
  if (q.type === 'mc') {
    document.querySelectorAll('.option-btn').forEach(btn => {
      btn.disabled = true;
      if (btn.dataset.val === q.answer) btn.classList.add('correct');
    });
  } else {
    const inp = document.getElementById('fillInput');
    if (inp) { inp.disabled = true; inp.classList.add('wrong'); }
  }

  showExplanation(q, false);
  showNextBtn();
}

function showQuestion() {
  answered = false;
  clearTimer();
  const q = partQuestions[currentQ];
  const progress = ((currentQ) / N) * 100;
  const partNames = ['', 'MULTIPLE CHOICE', 'FILL IN THE BLANK', 'MIXED MODE', 'FINAL TEST'];

  let questionHTML = '';

    questionHTML = `
      <div class="card-glass" style="padding:28px;margin-bottom:8px;">

              <span style="font-weight:700;color:#818cf8;margin-right:10px;">${'ABCD'[i]}.</span> ${o}
            </button>
          `).join('')}

        <div style="margin-bottom:20px;">
          <input type="text" id="fillInput" class="text-input" placeholder="Nhập từ tiếng Anh..." autocomplete="off" onkeydown="if(event.key==='Enter')handleFill()">

        <div style="display:flex;gap:10px;flex-wrap:wrap;">

        </div>
      </div>
    `;
  }

  document.getElementById('screen').innerHTML = `
    <div class="fade-in" style="max-width:600px;margin:0 auto;padding:60px 20px 40px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <div style="font-size:12px;color:#818cf8;font-weight:600;letter-spacing:1px;">PART ${currentPart}: ${partNames[currentPart]}</div>
        <div style="display:flex;align-items:center;gap:12px;">
          ${streak >= 3 ? `<span class="streak-badge">🔥 ${streak}</span>` : ''}

        <div id="nextBtnArea"></div>
      </div>
    </div>
  `;
  lucide.createIcons();
  startTimer(q.type === 'fill' ? 30 : 20);
  if (q.type === 'fill') setTimeout(() => document.getElementById('fillInput')?.focus(), 100);
}

window.handleMC = function(btn, val) {
  if (answered) return;
  answered = true;
  clearTimer();
  const q = partQuestions[currentQ];
  const isCorrect = val === q.answer;

  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (b.dataset.val === q.answer) b.classList.add('correct');
    else if (b === btn && !isCorrect) b.classList.add('wrong');
  });

  if (isCorrect) {
    score++; streak++; if (streak > maxStreak) maxStreak = streak;
    playSound('correct');
    btn.classList.add('pulse');
    
    // Get button position for fireworks
    const rect = btn.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    createFireworks(centerX, centerY);
    
    // Success toast
    showToast('🎉 Chính xác!', 'correct');
  } else {
    streak = 0;
    if (!wrongWords.includes(q.word.en)) wrongWords.push(q.word.en);
    playSound('wrong');
    btn.classList.add('shake');
    showToast('❌ Chưa đúng', 'wrong');
  }

  showExplanation(q, isCorrect);
  showNextBtn();
}

window.handleFill = function() {
  if (answered) return;
  const inp = document.getElementById('fillInput');
  const val = inp.value.trim().toLowerCase();
  if (!val) return;

  answered = true;
  clearTimer();
  const q = partQuestions[currentQ];
  const isCorrect = val === q.answer.toLowerCase();

  if (isCorrect) {
    inp.classList.add('correct');
    score++; streak++; if (streak > maxStreak) maxStreak = streak;
    playSound('correct');
    
    // Get input position for fireworks
    const rect = inp.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    createFireworks(centerX, centerY);
    
    showToast('🎉 Chính xác!', 'correct');
  } else {
    inp.classList.add('wrong');
    inp.disabled = true;
    streak = 0;
    if (!wrongWords.includes(q.word.en)) wrongWords.push(q.word.en);
    playSound('wrong');
    showToast('❌ Chưa đúng', 'wrong');
  }

  showExplanation(q, isCorrect);
  showNextBtn();
}

window.handleSkip = function() {
  if (answered) return;
  answered = true;
  clearTimer();
  streak = 0;
  const q = partQuestions[currentQ];
  if (!wrongWords.includes(q.word.en)) wrongWords.push(q.word.en);
  showExplanation(q, false);
  showNextBtn();
}

window.handleShowAnswer = function() {
  if (answered) return;
  answered = true;
  clearTimer();
  streak = 0;
  const q = partQuestions[currentQ];
  if (!wrongWords.includes(q.word.en)) wrongWords.push(q.word.en);
  const inp = document.getElementById('fillInput');
  if (inp) { inp.value = q.answer; inp.disabled = true; inp.classList.add('correct'); }
  showExplanation(q, false);
  showNextBtn();
}

  `;

function showNextBtn() {
  document.getElementById('nextBtnArea').innerHTML = `

window.nextQuestion = function() {
  currentQ++;
  if (currentQ >= N) {
    showResult();

                <div style="color:#818cf8;font-weight:600;margin-bottom:8px;">✨ Synonyms</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;">
                  ${WORDS[window.selectedWord].synonyms.split(',').map(s => `<span style="background:rgba(168,85,247,0.15);color:#d8b4fe;padding:4px 10px;border-radius:6px;font-size:12px;">${s.trim()}</span>`).join('')}
                </div>
              </div>
              ${WORDS[window.selectedWord].antonyms !== '—' ? `
                <div>
                  <div style="color:#818cf8;font-weight:600;margin-bottom:8px;">❌ Antonyms</div>
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">
                    ${WORDS[window.selectedWord].antonyms.split(',').map(a => `<span style="background:rgba(239,68,68,0.15);color:#fca5a5;padding:4px 10px;border-radius:6px;font-size:12px;">${a.trim()}</span>`).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <div style="margin-top:16px;">
              <div style="color:#818cf8;font-weight:600;margin-bottom:8px;">🔗 Collocations</div>
              <div style="display:flex;flex-wrap:wrap;gap:6px;">
                ${WORDS[window.selectedWord].collocations.split(',').map(c => `<span style="background:rgba(34,197,94,0.15);color:#86efac;padding:6px 12px;border-radius:6px;font-size:12px;border:1px solid rgba(34,197,94,0.3);">${c.trim()}</span>`).join('')}
              </div>
            </div>

            <div style="margin-top:16px;">
              <div style="color:#818cf8;font-weight:600;margin-bottom:8px;">👨‍👩‍👧‍👦 Word family</div>
              <div style="color:#cbd5e1;">${WORDS[window.selectedWord].wordFamily || '—'}</div>
            </div>

            <div style="margin-top:16px;display:flex;gap:10px;">
              <button class="btn-secondary" onclick="window.selectedWord = null; window.renderBank()">← Back</button>
            </div>
          </div>
        ` : ''}

        <div style="margin-top:24px;text-align:center;">
          <button class="btn-primary" onclick="showMenu()">🏠 Back to Menu</button>
        </div>
      </div>
    `;
    document.getElementById('screen').innerHTML = html;
    document.getElementById('searchInput')?.focus();
    lucide.createIcons();
  }

  window.updateBankDisplay = function() {
    window.searchQuery = document.getElementById('searchInput')?.value || '';
    window.renderBank();
  };

  window.selectWordDetail = function(idx) {
    window.selectedWord = window.selectedWord === idx ? null : idx;
    window.renderBank();
  };

  window.playWordAudio = function(word, buttonElement) {
    // Clean the input text: remove parts of speech indicators and extra spaces
    let cleanWord = word.replace(/^\([^)]+\)\s*/, '').trim(); // Remove (adj), (n), etc. at start
    cleanWord = cleanWord.replace(/\([^)]+\)/g, '').trim(); // Remove any remaining parentheses
    cleanWord = cleanWord.replace(/\//g, ' ').trim(); // Replace slashes with spaces for compound words

    // Cancel any ongoing speech to prevent overlap
    if ('speechSynthesis' in window) {
      speechSynthesis.cancel();
    }

    // Add playing class to button for visual feedback
    if (buttonElement) {
      buttonElement.classList.add('playing');
    }

    // Create utterance
    const utterance = new SpeechSynthesisUtterance(cleanWord);
    utterance.lang = 'en-US'; // Use US English
    utterance.rate = 0.9; // Slightly slower than default for clarity
    utterance.pitch = 1.0; // Normal pitch

    // Handle speech end
    utterance.onend = function() {
      // Remove playing class
      if (buttonElement) {
        buttonElement.classList.remove('playing');
      }
    };

    // Handle speech error
    utterance.onerror = function(event) {
      console.error('Speech synthesis error:', event.error);
      // Remove playing class on error
      if (buttonElement) {
        buttonElement.classList.remove('playing');
      }
      // Retry once if it fails (but not if interrupted)
      if (event.error !== 'interrupted') {
        setTimeout(() => {
          if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
          }
        }, 100);
      }
    };

    // Speak the word
    if ('speechSynthesis' in window) {
      speechSynthesis.speak(utterance);
    } else {
      console.warn('Speech synthesis not supported in this browser');
      // Remove playing class if not supported
      if (buttonElement) {
        buttonElement.classList.remove('playing');
      }
    }
  };

  renderBank();
}



// Start
showMenu();
});
</script>
</body>
</html>
